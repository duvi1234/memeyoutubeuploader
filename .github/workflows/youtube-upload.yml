name: YouTube Upload

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
      YOUTUBE_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
      YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID }}
      YOUTUBE_TITLE_PREFIX: ${{ vars.YOUTUBE_TITLE_PREFIX }}
      YOUTUBE_DESCRIPTION: ${{ vars.YOUTUBE_DESCRIPTION }}
      YOUTUBE_TAGS: ${{ vars.YOUTUBE_TAGS }}
      EMAIL_TO: ${{ vars.EMAIL_TO }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_SUBJECT_PREFIX: ${{ vars.EMAIL_SUBJECT_PREFIX }}
      EMAIL_ATTACHMENT_MAX_MB: ${{ vars.EMAIL_ATTACHMENT_MAX_MB }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
      GITHUB_ARTIFACT_NAME: generated-video
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run upload job
        run: python auto_upload.py --run-once

      - name: Upload generated video artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-video
          path: static/final_video.mp4
          if-no-files-found: ignore
          retention-days: 7
