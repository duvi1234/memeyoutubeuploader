name: YouTube Upload

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
      YOUTUBE_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
      YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID }}
      YOUTUBE_TITLE_PREFIX: ${{ vars.YOUTUBE_TITLE_PREFIX }}
      YOUTUBE_DESCRIPTION: ${{ vars.YOUTUBE_DESCRIPTION }}
      YOUTUBE_TAGS: ${{ vars.YOUTUBE_TAGS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run upload job
        run: python auto_upload.py --run-once
